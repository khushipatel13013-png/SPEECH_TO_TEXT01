{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

<link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>

    <div class="register-container">

        <h1>Sign Up</h1>

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="username" placeholder="Enter Username">

            <input type="email" name="email" placeholder="Enter Email">

            <div style="position:relative; width:100%;">

            <input type="password" id="password" name="password" placeholder="Password" style="width:100%;padding:12px;
              border-radius:10px;   border:1px solid #ccc;font-size:16px;box-sizing:border-box;">

    <span onclick="togglePassword()"style="position:absolute;right:15px;top:12px;cursor:pointer;">

        👁️

    </span>

</div>

            <button type="submit">
                Sign Up
            </button>

        </form>
    <p>

    Already have an account?

    <a href="/login/">

        Login

    </a>

    </p>

    </div>
<script>

    function togglePassword(){

        var passwordField =
        document.getElementById("password");

        if(passwordField.type == "password"){

            passwordField.type = "text";

        }

        else{

            passwordField.type = "password";

        }

    }

</script>
</body>

</html>
